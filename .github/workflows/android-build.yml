name: Build ALBAZ Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "index.html"
      - "ALBAZ_NE_V2_2_USER_GUIDE_AR.html"
      - "site.webmanifest"
      - "sw.js"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew clean :app:assembleDebug --stacktrace

      - name: Build Release Unsigned APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Dist
        shell: bash
        run: |
          mkdir -p android/Dist
          cp android/app/build/outputs/apk/debug/app-debug.apk              android/Dist/ALBAZ_Smart_Crescent_Atlas_v2.2.2_DEBUG.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk              android/Dist/ALBAZ_Smart_Crescent_Atlas_v2.2.2_RELEASE_UNSIGNED.apk

      - name: Package Complete Android Studio Project
        shell: bash
        run: |
          rm -rf android/app/build android/.gradle android/build
          zip -r ALBAZ_Smart_Crescent_Atlas_Android_v2.2.2_COMPLETE.zip android             -x "android/.idea/*" "android/**/.DS_Store"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ALBAZ-Android-APKs-v2.2.2
          path: android/Dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Complete Project
        uses: actions/upload-artifact@v4
        with:
          name: ALBAZ-Android-Project-v2.2.2
          path: ALBAZ_Smart_Crescent_Atlas_Android_v2.2.2_COMPLETE.zip
          if-no-files-found: error
          retention-days: 30
